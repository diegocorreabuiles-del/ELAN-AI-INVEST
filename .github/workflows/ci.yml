name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "docs/**", "recovery/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements.lock
      - run: python scripts/check_git_flow.py
      - run: python -m pip install --upgrade "pip==26.1.2"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_lock.py
      - run: python -m pip check
      - run: python -m mypy
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pytest
      - run: python scripts/build_distribution.py --output dist/elan-quantum-ci.zip
      - run: python scripts/build_distribution.py --verify dist/elan-quantum-ci.zip
