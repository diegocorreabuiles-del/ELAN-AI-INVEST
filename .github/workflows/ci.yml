name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**", "docs/**", "recovery/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements.lock
      - run: python scripts/check_git_flow.py
      - run: python scripts/check_module_lifecycle.py
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .[dev]
      - run: python scripts/check_lock.py
      - run: python -m pip check
      - run: python -m mypy
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m pytest
      - run: python scripts/build_distribution.py --output dist/elan-quantum-ci.zip
      - run: python scripts/build_distribution.py --verify dist/elan-quantum-ci.zip

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit locked dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          no-deps: true
          vulnerability-service: PyPI
