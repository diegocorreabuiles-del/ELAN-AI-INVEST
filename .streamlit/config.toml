[theme]
base = "dark"
primaryColor = "#0F8F6F"
backgroundColor = "#0F141A"
secondaryBackgroundColor = "#181E26"
textColor = "#F2F5F7"
linkColor = "#35D3A1"
codeTextColor = "#B8C4CE"
codeBackgroundColor = "#0B0F14"
borderColor = "#2A333D"
dataframeBorderColor = "#2A333D"
dataframeHeaderBackgroundColor = "#181E26"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false

redColor = "#FF5C70"
orangeColor = "#F59E5B"
yellowColor = "#F2C94C"
greenColor = "#21C994"
blueColor = "#4BA3FF"
violetColor = "#9B8AFB"
grayColor = "#8B98A5"

chartCategoricalColors = ["#21C994", "#4BA3FF", "#FF5C70", "#9B8AFB", "#F59E5B", "#28B8C7", "#F2C94C", "#8B98A5"]
chartSequentialColors = ["#0F141A", "#13211F", "#16302A", "#184033", "#19523E", "#1A654A", "#1B7957", "#1D8E64", "#1FA572", "#21C994"]

[theme.sidebar]
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#141A21"
textColor = "#E8EDF1"
primaryColor = "#0F8F6F"
borderColor = "#242D36"
codeBackgroundColor = "#090C10"
