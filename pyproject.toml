[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "elan-ai-invest"
version = "1.2.2"
description = "Plataforma profesional de analisis cuantitativo y gestion de inversiones."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ELAN Quantum" }
]
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.54",
  "plotly>=5.24",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=7.1",
  "ruff>=0.9",
  "black>=24.10",
  "mypy>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=75"

[tool.coverage.run]
source = ["."]
source_pkgs = ["elan_ai_invest"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.black]
target-version = ["py311", "py312", "py313", "py314"]
line-length = 100

[tool.mypy]
files = [
  "src/elan_ai_invest/core",
  "src/elan_ai_invest/portfolio/engine.py",
  "src/elan_ai_invest/risk.py",
  "src/elan_ai_invest/paper_trading.py",
  "src/elan_ai_invest/system_status.py",
  "src/elan_ai_invest/dashboard/safe.py",
]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
