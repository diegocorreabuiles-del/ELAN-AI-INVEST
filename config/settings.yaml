app:
  name: "ELAN Quantum"
  version: "1.2.2"
  environment: "development"

market:
  provider: "yahoo"
  period: "2y"
  interval: "1d"
  minimum_history: 210
  benchmark: "SPY"

scoring:
  trend_weight: 0.40
  momentum_weight: 0.35
  volatility_weight: 0.15
  drawdown_weight: 0.10

backtest:
  lookback: 63
  top_n: 3
  rebalance_days: 21

storage:
  database_path: "data/elan_ai_invest.db"

logging:
  level: "INFO"
  file_path: "logs/elan_ai_invest.log"
  max_bytes: 2000000
  backup_count: 5

risk:
  confidence_levels: [0.95, 0.99]
  annualisation_days: 252
  risk_budget_per_position_pct: 0.50
  max_position_pct: 15.0
  max_portfolio_volatility_pct: 20.0

portfolio:
  initial_capital: 100000
  profile: "moderado"
  min_score: 55
  max_positions: 8
  max_position_pct: 15.0
  min_cash_pct: 20.0

paper_trading:
  enabled: true
  initial_capital: 100000
  commission_pct: 0.10
  stop_loss_pct: 8.0
  max_open_positions: 8
  database_path: "data/paper_trading.db"
